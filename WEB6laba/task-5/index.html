<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Завдання 5 — віджет погоди</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather">
        <div class="arrows">
            <span class="arrow">&larr;</span>
            <span class="arrow">&rarr;</span>
        </div>

        <div class="panel panel-main">
            <div class="temp">17</div>
        </div>

        <div class="panel panel-forecast">
            <ul class="days">
                <li class="day"><span class="day-name">Mon</span><span class="day-temp">17°</span></li>
                <li class="day"><span class="day-name">Tue</span><span class="day-temp">19°</span></li>
                <li class="day"><span class="day-name">Wed</span><span class="day-temp">16°</span></li>
                <li class="day"><span class="day-name">Thu</span><span class="day-temp">18°</span></li>
                <li class="day"><span class="day-name">Fri</span><span class="day-temp">21°</span></li>
            </ul>
        </div>

        <!-- Хмара, намальована через CSS -->
        <div class="cloud">
            <i class="puff puff-1"></i>
            <i class="puff puff-2"></i>
            <i class="puff puff-3"></i>
            <i class="puff puff-4"></i>
            <i class="puff puff-5"></i>
        </div>
    </div>
</body>
</html>
