<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 1 - Таблиця</title>
    <style type="text/css">
       table { border-collapse: collapse; width: 400px;}
       td { border: 5px solid #000; }
       tr {width: 60px; height: 60px; }
    </style>
</head>
<body>
    <h1 align="center">Завдання 1</h1>

    <table align="center">
        <!-- Рядок 1 -->
        <tr>
            <td colspan="8" bgcolor="#2cf5d3"><br/></td>
        </tr>
        <!-- Рядок 2 -->
        <tr>
            <td rowspan="6" bgcolor="#ffffcc"><br/></td>
            <td colspan="6" bgcolor="#2cf5d3"><br/></td>
            <td rowspan="6" bgcolor="#ffffcc"><br/></td>
        </tr>
        <!-- Рядок 3 -->
        <tr>
            <td rowspan="4" bgcolor="#ffffcc"><br/></td>
            <td colspan="4" bgcolor="#2cf5d3"><br/></td>
            <td rowspan="4" bgcolor="#ffffcc"><br/></td>
        </tr>
        <!-- Рядок 4 -->
        <tr>
            <td rowspan="2" bgcolor="#ffffcc"><br/></td>
            <td bgcolor="#ff0d0d"><br/></td>
            <td bgcolor="#0026ff"><br/></td>
            <td rowspan="2" bgcolor="#ffffcc"><br/></td>
        </tr>
        <!-- Рядок 5 -->
        <tr>
            <td bgcolor="#1aff1a"><br/></td>
            <td bgcolor="#ffff1a"><br/></td>
        </tr>
        <!-- Рядок 6 -->
        <tr>
            <td colspan="4" bgcolor="#2cf5d3"><br/></td>
        </tr>
        <!-- Рядок 7 -->
        <tr>
            <td colspan="6" bgcolor="#2cf5d3"><br/></td>
        </tr>
        <!-- Рядок 8 -->
        <tr>
            <td colspan="8" bgcolor="#2cf5d3"><br/></td>
        </tr>
    </table>

    <p align="center"><a href="../index.html">Повернутись на головну</a></p>
</body>
</html>
